sessions:
  - slug: event-overview
    block_number: 0
    position: 1
    kind: talk
    title: "Django Pub AI Edition — огляд заходу"
    duration_min: 60
    stack: "Django, NumPy, Pandas, PyTorch, LangGraph, pgvector"
    speakers: [vlad]
    paragraphs:
      - "Подія називається Django Pub AI Edition і проходить як Django.Pub @ ЛНТУ. Це практичний гайд побудови та інтеграції AI в Django-проєкти: від сирих даних до автономних агентів."
      - "Аудиторія: Django- і Python-інженери, архітектори, tech leads. Головна мета виступу — показати прагматичний шлях еволюції AI-систем у Django без відриву від продакшену."
      - "Є два шари таймінгу, і їх не треба змішувати. Сценарій самої доповіді розрахований на 60 хвилин: вступ, три блоки по 12–18 хвилин і Q&A. Програма живого заходу довша: блок 1 триває 30–35 хвилин, далі дискусія і виступи студентів 15 хвилин, блок 2 близько 30 хвилин, знову дискусія 15 хвилин, блок 3 близько 15 хвилин і інтерактив 10 хвилин."
      - "У кожному блоці обов'язкова точка стику з Django: ORM, Celery або Channels. Менше формул, більше архітектури: надійність, latency, вартість хостингу і масштабованість."
      - "На останньому слайді має бути QR-код на GitHub-репозиторій із демо-кодом. Учасники клонують репозиторій, вставляють тимчасовий ключ OpenAI на 1–3 дні і піднімають стек однією командою Docker Compose."

  - slug: block-1-classical-ml
    block_number: 1
    position: 2
    kind: talk
    title: "Data Science і Classical ML — фундамент даних"
    duration_min: 35
    stack: "NumPy, Pandas, Polars, scikit-learn, OpenCV, Matplotlib, Plotly, Jupyter"
    speakers: [block1]
    paragraphs:
      - "Головна ідея блоку 1: якісний AI починається з аналізу і препроцесингу даних. Треба розуміти, як працювати з даними всередині і навколо Django до важких моделей чи LLM."
      - "Стек блоку: NumPy, Pandas, Polars, scikit-learn, OpenCV, Matplotlib, Plotly, Jupyter. Про NumPy, Pandas і Polars розповідає спікер блоку 1. Влад Гетьманенко цей блок не веде."
      - "Агрегація даних: великі вибірки з Django ORM вивантажують у Pandas або Polars так, щоб не вичерпати RAM. Векторні операції Pandas і Polars перемагають важкі цикли по Django QuerySet. Порада спікеру — показати цю різницю у швидкості наживо."
      - "Класичний ML замість оверхеду: у приблизно 70% бізнес-задач (скоринг, churn, класифікація) scikit-learn, зокрема RandomForest і підхід рівня XGBoost, швидший, дешевший і надійніший за нейромережі."
      - "OpenCV для базового зору: препроцесинг фото користувачів безпосередньо під час завантаження. Ресайз, нормалізація, кроп і підготовка до OCR або детекції."
      - "Демонстрація блоку 1: експорт історії активності користувачів з Django ORM, швидка аналітика в Pandas або Polars, тренування класифікатора відтоку і валідація фото через OpenCV."
      - "У сценарії короткої доповіді на цей блок відведено 12–15 хвилин. У програмі живого заходу презентація блоку 1 триває 30–35 хвилин."

  - slug: discussion-1-students
    block_number: 1
    position: 3
    kind: student
    title: "Дискусія і виступи студентів після блоку 1"
    duration_min: 15
    stack: "NumPy, Pandas, Polars, scikit-learn, OpenCV"
    speakers: [students]
    paragraphs:
      - "Після блоку 1 йде дискусійний блок і виступи студентів, близько 15 хвилин. На екран ставлять презентацію-заглушку."
      - "Студенти ЛНТУ показують власні практичні роботи і навчальні проєкти з бібліотек Data Science та комп'ютерного зору. Імена конкретних студентів у матеріалах заходу ще не зафіксовані."
      - "Обговорюють, як ці інструменти використовують на практиці, і наводять приклади компаній, які працюють із NumPy, Pandas, Polars, scikit-learn і OpenCV."
      - "Студенти-доповідачі отримують досвід публічного виступу, презентації власних розробок і зворотний зв'язок від інженерів."

  - slug: block-2-mlops
    block_number: 2
    position: 4
    kind: talk
    title: "Deep Learning і MLOps — продакшен та інфраструктура"
    duration_min: 30
    stack: "PyTorch, Hugging Face, ONNX, MLflow, Docker, Kubernetes, Terraform, Celery, Redis"
    speakers: [block2]
    paragraphs:
      - "Головна ідея блоку 2: як подолати прірву між Jupyter Notebook і production. Йдеться про запуск DL-моделей, автоматизацію хмари і безперебійну роботу з Django."
      - "Стек блоку: PyTorch, Hugging Face, ONNX, MLflow, Docker, Kubernetes, Terraform, Celery і Redis. Про PyTorch, ONNX і Celery розповідає спікер блоку 2. Влад Гетьманенко цей блок не веде."
      - "Архітектура без блокувань: важкі моделі вбивають WSGI і ASGI потоки, зокрема воркери Gunicorn. Правильна схема — Celery background workers і черги повідомлень. Типовий антипатерн, на якому спікер має наголосити: import torch і виклик model(x) прямо у views.py."
      - "Прискорення інференсу: експорт моделі у формат ONNX або використання BentoML чи TorchServe, щоб знизити latency і споживання ресурсів."
      - "MLOps-цикл: експерименти, метрики й артефакти моделей реєструють і версіонують через MLflow."
      - "Хмарна інфраструктура як код: GPU- і CPU-інстанси піднімають Terraform, контейнеризують у Docker і масштабують у Kubernetes."
      - "Демонстрація блоку 2: користувач робить запит через Django API, задача летить у Celery, воркер виконує інференс оптимізованої PyTorch або ONNX моделі, результат зберігається в Postgres."
      - "У сценарії короткої доповіді на цей блок відведено 15–18 хвилин. У програмі живого заходу презентація блоку 2 триває близько 30 хвилин."

  - slug: discussion-2-students
    block_number: 2
    position: 5
    kind: discussion
    title: "Дискусія про DevOps, професію і навантаження"
    duration_min: 15
    stack: "Docker, Kubernetes, Terraform, Celery"
    speakers: [students, block2]
    paragraphs:
      - "Після блоку 2 знову дискусія і виступи студентів, близько 15 хвилин. На екран ставлять презентацію-заглушку."
      - "Тема розмови: автоматизація процесів DevOps і перспективи самої професії, а також робота зі складними архітектурами."
      - "Друга тема: оптимізація роботи з архітектурою, прийняття рішень і ситуативна реакція на навантаження."
      - "Імена студентів, які виступають у цьому блоці, у матеріалах ще не зафіксовані."

  - slug: block-3-agents
    block_number: 3
    position: 6
    kind: talk
    title: "LLM, RAG і AI-агенти — інтелект нового покоління"
    duration_min: 15
    stack: "LangChain, LangGraph, LlamaIndex, pgvector, PostgreSQL, OpenAI, Claude, Ollama, Django Channels"
    speakers: [vlad]
    paragraphs:
      - "Блок 3 веде Влад Гетьманенко. Головна ідея: від простих запитів до LLM до автономних агентів із пам'яттю, інструментами і доступом до бази знань Django. Це кульмінація виступу, її бажано показати живим демо."
      - "Стек блоку: LangChain, LangGraph, LlamaIndex, pgvector у PostgreSQL, OpenAI, Claude, Ollama і Django Channels."
      - "RAG на рідному PostgreSQL: pgvector — зручний вибір для Django, бо не потрібна окрема векторна інфраструктура. Векторний пошук пов'язаний безпосередньо з Django ORM. Пошук найближчих фрагментів роблять через CosineDistance і зрізають результат до кількох найрелевантніших."
      - "Приклад з виступу Влада: модель KnowledgeChunk має текстове поле і VectorField на 1536 вимірів. Запит упорядковує чанки за косинусною відстанню до вектора питання і бере перші три."
      - "Еволюція від LangChain до LangGraph: лінійних ланцюжків уже недостатньо. Графова архітектура дає керовані цикли, відновлення після помилок і стабільніших агентів. Граф цього демо має вузол пошуку, вузол відмови без контексту, вузол агента і вузол інструментів."
      - "Real-time стрімінг: токени віддають користувачеві на льоту через Django Channels і WebSocket, без очікування повної відповіді і без блокування веб-воркерів. Асинхронний consumer читає потік агента і надсилає шматки в сокет."
      - "Tool calling і безпека: LLM може викликати методи Django, але лише після жорсткої перевірки прав. У прикладі з виступу статус замовлення читають фільтром Order.objects.filter(id=order_id, user=user), тож чуже замовлення не віддається. У цьому демо інструмент аналітики вимагає дозвіл conference.view_analytics, який є в групи organizer."
      - "Системний промпт змушує модель триматися контексту матеріалів. Якщо тема на заході не звучала, асистент має прямо сказати, що такої інформації немає, а не вигадувати."
      - "У сценарії доповіді на блок 3 відведено 15–18 хвилин. У програмі живого заходу презентація блоку 3 триває близько 15 хвилин, одразу після неї — інтерактив."

  - slug: interactive
    block_number: 3
    position: 7
    kind: discussion
    title: "Інтерактив — чат з матеріалами виступів"
    duration_min: 10
    stack: "Django, LangGraph, pgvector, Django Channels, Docker Compose"
    speakers: [vlad]
    paragraphs:
      - "Інтерактив триває близько 10 хвилин. Влад показує проєкт, у якому RAG-база вже містить матеріали виступів. Люди заходять у чат і питають усе про виступ."
      - "Приклади питань, які запропоновані учасникам: що розказував Влад, хто розказував про NumPy, які поради щодо Celery."
      - "Щоб протестувати локально, треба клонувати репозиторій, вставити ключ, який дадуть на 1–3 дні, і запустити стек. Окремий векторний сервіс піднімати не потрібно: пошук живе в PostgreSQL."
      - "Після інтерактиву — Q&A. Спікери й експерти відповідають на питання залу про практичне впровадження AI. Загальні рекомендації для спікера: у кожному блоці показати стик із Django, тримати фокус на архітектурі, а не на формулах, і залишити посилання на репозиторій."

  - slug: schedule
    block_number: 0
    position: 8
    kind: talk
    title: "Таймінг сценарію доповіді"
    duration_min: 60
    stack: ""
    speakers: [vlad]
    paragraphs:
      - "Таймінг сценарію доповіді на 60 хвилин. 00:00–05:00 вступ: чому Django сьогодні є сильним хабом для AI, і огляд плану з трьох етапів."
      - "05:00–18:00 блок 1, дані і класичний ML. Ключовий інсайт: дані понад усе, ORM разом із Polars або Pandas, scikit-learn як швидка і дешева альтернатива."
      - "18:00–34:00 блок 2, deep learning і MLOps. Ключовий інсайт: розділяйте веб і інференс через Celery, оптимізуйте моделі через ONNX, автоматизуйте хмару через Terraform."
      - "34:00–50:00 блок 3, LLM і агенти. Ключовий інсайт: pgvector вбудовує RAG прямо в Django, LangGraph дає керованих агентів із tool calling."
      - "50:00–60:00 підсумки і Q&A: відповіді на питання залу і посилання на репозиторій із матеріалами та демо."
